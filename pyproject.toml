[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minutesman"
version = "0.1.0"
description = "Diarized Urdu/English (Roman Urdu) meeting transcription on the OpenAI API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "pydantic>=2.6",
    "numpy>=1.24",
    "imageio-ffmpeg>=0.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Local speaker embeddings for acoustic confidence scores (CPU; ~1 GB with torch).
voiceprint = ["torch>=2.2", "torchaudio>=2.2", "speechbrain>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
minutesman = "minutesman.cli:main"

[tool.setuptools]
packages = ["minutesman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
